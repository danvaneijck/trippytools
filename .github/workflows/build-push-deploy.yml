name: Build, Push & Deploy

# Builds the trippytools static SPA into a Docker image, pushes it to GHCR, then
# SSHes the trippy box to pull + (re)start the `trippytools` service that lives
# in the trippinj_docker_env compose stack.
#
# The Docker build's own `yarn build` is the hard gate — a broken build can't
# produce an image and the deploy job is skipped.
#
# A separate `quality` job runs `yarn typecheck` + `yarn lint` for visibility but
# is NON-BLOCKING (continue-on-error): this repo carries a large pre-existing
# type/lint debt (Vercel only ever ran `vite build`). Ratchet those counts down
# over time, then flip continue-on-error off to make it a real gate.
#
# Required repo secrets:
#   REMOTE_HOST / REMOTE_USER / SSH_PRIVATE_KEY  — same trippy box + deploy user
#                                                  as the trippinj backend CI.
# The Telegram alert bot token lives only in the trippinj backend .env
# (TRIPPYTOOLS_TG_BOT_TOKEN); the SPA posts to /alerts/trippytools.

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/trippytools

jobs:
  quality:
    # Non-blocking type/lint visibility. Does NOT gate build-and-push or deploy.
    # --ignore-scripts skips the wallet-strategy native postinstall (usb/node-hid
    # node-gyp) — tsc/eslint only need the published type defs, not native bins.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000
      - name: Typecheck (non-blocking)
        continue-on-error: true
        run: yarn typecheck
      - name: Lint (non-blocking)
        continue-on-error: true
        run: yarn lint

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          build-args: |
            VITE_HASURA_URL=https://api.trippyinj.xyz/v1/graphql
            VITE_CHOICE_URL=https://api.choice.exchange/v1/graphql
          cache-from: type=gha,scope=trippytools
          cache-to: type=gha,mode=max,scope=trippytools

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      # Join the tailnet as an ephemeral tag:ci node. The tailnet policy lets
      # tag:ci reach tag:server on tcp:22 and nothing else.
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.103.91.20
      - name: Deploy to trippy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: 100.103.91.20 # trippy's tailnet IP
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          # The host key is pinned, not accepted on first use.
          echo 'trippy ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII32dHVtZEO/8BRrdh1JYwzfuAiS87b92W/fF21/Am1Z' > ~/.ssh/known_hosts
          # This key has no shell: it is pinned on the server to the forced
          # command /usr/local/bin/trippy-deploy, which runs `git pull --ff-only`
          # and `make up ARGS=trippytools` in trippinj_docker_env, then prunes
          # images, and refuses anything else.
          ssh -i ~/.ssh/id_deploy \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=trippy \
              "$REMOTE_USER@$REMOTE_HOST" \
              trippytools
