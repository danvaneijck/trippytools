# trippytools ingress — TLS is terminated upstream by Traefik (see the
# trippytools service labels in trippinj_docker_env/docker-compose.yml); this
# nginx only serves the static SPA bundle on :80.
#
# Replaces vercel.json's catch-all rewrite ("/[^.]+" -> "/") with a try_files
# fallback to /index.html so the React Router virtual routes resolve.
#
# Caching uses the `expires` directive (not `add_header Cache-Control`) on
# purpose: nginx's `add_header` does NOT merge — a single `add_header` in a
# `location` block drops every `add_header` inherited from `server`. Using
# `expires` for cache control keeps the server-level security headers below
# inherited by both locations.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # App-level security headers, emitted on errors too (`always`). HSTS belongs
    # at the edge (Traefik), so it's intentionally not set here. Both locations
    # below avoid `add_header` so these stay inherited.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # Content-Security-Policy, in two layers.
    # Enforced: only directives nothing in the app depends on (no plugins, no
    # <base>, framing as X-Frame-Options already allows).
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # Report-Only: the full policy. Violations show in the browser console;
    # flip it to enforced once a pass through every tool shows none.
    # - cdnjs: three.js and the Font Awesome stylesheet + fonts (index.html).
    # - script-src 'wasm-unsafe-eval': a wasm module in the main bundle.
    #   static.cloudflareinsights.com: Cloudflare Web Analytics, which the edge
    #   injects; it reports to cloudflareinsights.com (connect-src).
    #   A script-src 'eval' report from the main bundle is expected and benign:
    #   protobufjs's inquire() tries eval("require") inside a try/catch and
    #   falls back when it is refused, so 'unsafe-eval' stays out.
    # - style-src 'unsafe-inline': emotion and react-toastify inject styles.
    # - img-src https:: token and NFT images come from arbitrary hosts (most
    #   through wsrv.nl).
    # - connect-src: Injective sentry/indexer/mito (*.injective.network),
    #   Choice and trippyinj APIs, 1rpc.io (EVM wallet rpc), dojo.trading
    #   (Sushi tool) and the IPFS gateways NFT metadata uses; data:/blob: for
    #   the canvas-to-file exports. Metadata or claim-drop leaves on any other
    #   host are reported; decide before enforcing.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' data: blob: https://*.injective.network wss://*.injective.network https://api.choice.exchange https://*.trippyinj.xyz wss://*.trippyinj.xyz https://1rpc.io https://*.dojo.trading https://ipfs.io https://*.ipfs.w3s.link https://*.ipfs.dweb.link https://gateway.pinata.cloud https://cloudflareinsights.com; worker-src 'self' blob:; frame-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Content-addressed (hash-named) vite assets — cache hard for a year.
    location /assets/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    # Everything else — let the SPA router resolve, falling back to index so a
    # deep-link refresh doesn't 404. `expires -1` => Cache-Control: no-cache, so
    # index.html always revalidates and deploys take effect immediately.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
